{% extends 'aprendizaje/base.html' %}

{% block content %}
<div class="container" style="max-width: 700px; margin: 40px auto; color: #fff; padding: 20px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 style="color: #ffaa00; margin: 0;">✏️ Editar Misión</h2>
        <span style="background: rgba(255, 170, 0, 0.1); color: #ffaa00; padding: 5px 10px; border-radius: 5px; font-weight: bold;">
            ID: {{ oferta.id }}
        </span>
    </div>
    
    <hr style="border-color: #333; margin-bottom: 30px;">

    <div style="background: #111; padding: 30px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
        <form method="POST">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button type="submit" class="btn" style="flex: 2; padding: 15px; font-size: 1rem; border-radius: 8px;">
                    💾 GUARDAR CAMBIOS
                </button>
                <a href="{% url 'dashboard_reclutador' %}" class="btn btn-outline" style="flex: 1; padding: 15px; text-align: center; font-size: 1rem; border-color: #555; color: #bbb; border-radius: 8px;">
                    CANCELAR
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Aseguramos que los inputs tomen el 100% del ancho del formulario */
    form p {
        margin-bottom: 20px;
    }
    form label {
        display: block;
        margin-bottom: 8px;
        color: #ddd;
        font-weight: bold;
    }
</style>
{% endblock %}
